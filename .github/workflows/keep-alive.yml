name: Keep backend warm

# Render's free plan spins a web service down after 15 minutes idle, and the
# cold start that follows takes ~30 seconds — long enough that the admin login
# and the voice pipeline both look broken.
#
# This used to be a plain `*/10` cron, which did not work: GitHub deprioritises
# scheduled workflows heavily on free runners, and the observed gaps between
# runs were 102–354 minutes, not 10. The service was cold almost all the time.
#
# So instead of relying on the schedule to fire often, each run holds a runner
# and pings every minute for just under 6 hours (the maximum job length). The
# schedule only has to start a run occasionally rather than punctually, and
# overlapping runs are harmless. Actions minutes are unlimited on public repos,
# so this is free.
#
# Note: GitHub disables scheduled workflows after 60 days of repo inactivity —
# a push to main re-enables them.

on:
  schedule:
    # every 5 hours; runs last ~5h50m so a late start still overlaps the last one
    - cron: "0 */5 * * *"
  workflow_dispatch: {}

# a new run replaces one already in flight rather than stacking runners
concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Ping /health every minute
        run: |
          URL="https://saksham-api-82mn.onrender.com/health"
          END=$(( $(date +%s) + 350*60 ))
          ok=0; fail=0
          while [ "$(date +%s)" -lt "$END" ]; do
            if curl -sf --max-time 45 "$URL" > /dev/null; then
              ok=$((ok+1))
            else
              # a cold start can exceed the timeout; that is the very thing we
              # are preventing, so it must not fail the job
              fail=$((fail+1))
              echo "ping failed at $(date -u +%H:%M:%S) (service may be cold-starting)"
            fi
            sleep 60
          done
          echo "done — $ok ok, $fail failed"
